[project]
name = "glaw-ai"
version = "0.1.0"
description = "RAG-based multilingual legal assistant AI server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.121.1",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.18",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.3.3",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "redis>=6.2.0",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.38.0",
    "langchain-google-genai>=4.2.1",
    "greenlet",
]

[dependency-groups]
dev = [
    "ruff>=0.14.8",
]
data = [
    "datasets>=4.4.1",
    "torch>=2.12.0",
    "tqdm>=4.67.1",
    "transformers>=5.9.0",
]
eval = [
    "datasets>=4.4.1",
    "pandas>=2.3.3",
    "ragas>=0.4.3",
]
mteb = [
    "huggingface-hub>=1.16.0",
    "mteb>=2.12.30",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "torch>=2.12.0",
    "tqdm>=4.67.1",
    "transformers>=5.9.0",
]

[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["E402"]
"src/scripts/*.py" = ["E402"]
